services:
  ranker:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: "none"
    volumes:
      - ./:/app
    command:
      - python
      - rank.py
      - --candidates
      - /app/[PUB] India_runs_data_and_ai_challenge/[PUB] India_runs_data_and_ai_challenge/India_runs_data_and_ai_challenge/candidates.jsonl
      - --jd
      - /app/jd.txt
      - --out
      - /app/redrob_senior_ai_engineer_ranking.csv
