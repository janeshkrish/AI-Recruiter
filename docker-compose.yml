# ==============================================================================
# AI Recruiter Brain — Docker Compose
# ==============================================================================
# Usage:
#   docker-compose up -d              # Start all services
#   docker-compose up -d --build      # Rebuild and start
#   docker-compose down               # Stop all services
#   docker-compose logs -f api        # Follow API logs

version: "3.9"

services:
  # --------------------------------------------------------------------------
  # Qdrant Vector Database
  # --------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: recruiter-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # FastAPI Backend
  # --------------------------------------------------------------------------
  api:
    build:
      context: .
      target: api
    container_name: recruiter-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_USE_INMEMORY=false
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - model_cache:/root/.cache
      - ./data:/app/data
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Streamlit Dashboard
  # --------------------------------------------------------------------------
  streamlit:
    build:
      context: .
      target: streamlit
    container_name: recruiter-streamlit
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_USE_INMEMORY=false
    depends_on:
      - api
    volumes:
      - model_cache:/root/.cache
      - ./data:/app/data
    restart: unless-stopped

volumes:
  qdrant_data:
    driver: local
  model_cache:
    driver: local

