[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-recruiter"
version = "0.1.0"
description = "AI Recruiter backend and frontend workspace"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["recruiter_brain*", "src*"]
