ai_usage_summary: |
  Used AI assistance for code implementation, validation, and UI wiring.
  Candidate ranking is performed locally with deterministic rule-based scoring.
  No candidate data is sent to an external model during ranking.

methodology_summary: |
  Deterministic document-informed ranker for the Senior AI Engineer JD. The
  scorer reads full candidate profiles, career history, skills, education,
  certifications, projects, languages, and Redrob signals, then applies the
  requested rubric: production ML, retrieval/ranking, vector databases, Python,
  evaluation frameworks, startup/product mindset, behavioral signals, career
  progression, location/relocation, and GitHub/open source. It explicitly
  downweights consulting-only, non-technical, research-only, framework-only,
  CV/speech-only, robotics-only, short-tenure, inconsistent, and keyword-stuffed
  profiles. Reasoning is generated from templates populated only with computed
  evidence.

declarations:
  read_submission_spec: true
  code_is_original_work: true
  no_collusion: true
  honeypot_check_done: true
  reproduction_tested: true
